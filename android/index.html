add('a1','Agachamento livre','Livre',3,'6–8','2–3 min','Quadríceps e glúteos','a1','Movimento composto de agachar com a barra apoiada na parte superior das costas.',[

add('a2','Elevação pélvica com barra','Livre',3,'8–10','2 min','Glúteos','a2','Elevação do quadril com apoio da parte superior das costas em um banco.',[

add('a3','Cadeira extensora','Máquina',2,'10–15','60–90 s','Quadríceps','a3','Máquina em que você estende os joelhos, elevando a almofada com a parte inferior das pernas.',[

add('a4','Supino reto com barra','Livre',3,'6–10','2–3 min','Peitoral e tríceps','a4','Empurrar uma barra deitado em um banco reto, com os pés apoiados no chão.',[

add('a5','Remada com apoio no peito','Máquina',3,'8–12','90–120 s','Costas','a5','Remada com o tórax apoiado, diminuindo a necessidade de estabilizar a lombar.',[
'Ajuste o apoio ao peito e segure as alças.','Puxe os pegadores em direção ao tronco aproximando as escápulas.','Volte devagar sem tirar o peito do suporte.'],'Não balance o tronco nem eleve os ombros em excesso.');
add('a6','Panturrilha em pé','Máquina',3,'10–15','60–90 s','Panturrilhas','a6','Elevar os calcanhares na máquina, movimentando o tornozelo.',[
'Posicione a parte da frente dos pés na plataforma e ajuste os apoios.','Suba os calcanhares de maneira firme, ficando na ponta dos pés.','Desça lentamente para alongar a panturrilha.'],'Evite saltar ou flexionar e estender os joelhos para mover a carga.');
add('a7','Abdominal na polia','Cabo',2,'12–15','60–90 s','Abdômen','a7','Flexão do tronco usando uma corda presa à polia alta, geralmente ajoelhado.',[
'Ajoelhe-se diante da polia e segure a corda ao lado da cabeça.','Aproxime as costelas da pelve, arredondando suavemente a parte superior do tronco.','Retorne sem perder o controle da carga.'],'Evite apenas puxar a corda com os braços.');
// TERÇA: 8 exercícios
add('b1','Puxada alta pronada','Máquina',3,'8–12','90–120 s','Costas','b1','Puxada vertical na máquina com as palmas voltadas para a frente.',[
'Sente-se e encaixe as coxas sob o apoio; segure a barra um pouco além dos ombros.','Puxe a barra na direção da parte superior do peito, com cotovelos descendo ao lado do corpo.','Retorne lentamente, permitindo que os braços subam.'],'Evite puxar a barra por trás da nuca ou jogar o tronco para trás.');
add('b2','Supino inclinado com halteres','Livre',3,'8–12','90–120 s','Peitoral superior','b2','Supino realizado com halteres em banco inclinado.',[
'Regule o banco para uma inclinação moderada e estabilize as costas.','Empurre os halteres acima do peito, mantendo os punhos alinhados.','Desça devagar até uma amplitude confortável.'],'Evite inclinar demais o banco ou bater os halteres no topo.');
add('b3','Remada baixa','Cabo',2,'10–12','90–120 s','Costas','b3','Puxada horizontal no aparelho de cabo, sentado com os pés apoiados.',[
'Sente-se com os joelhos levemente flexionados e coluna estável.','Puxe o pegador em direção à região abdominal levando os cotovelos para trás.','Volte controladamente, sem arredondar demais a lombar.'],'Evite usar o balanço do corpo para vencer a carga.');
add('b4','Desenvolvimento com halteres','Livre',2,'8–12','90–120 s','Ombros','b4','Empurrar halteres acima da cabeça, sentado em banco com encosto.',[
'Sente-se com as costas apoiadas e leve os halteres à altura dos ombros.','Empurre-os verticalmente até quase estender completamente os cotovelos.','Desça com controle à altura confortável.'],'Mantenha o abdômen ativo e evite arquear demais a lombar.');
add('b5','Cadeira flexora sentada','Máquina',2,'12–15','60–90 s','Posteriores de coxa','b5','Aparelho sentado em que você flexiona os joelhos puxando a almofada com as pernas.',[
'Ajuste o banco e os apoios nas coxas e pernas.','Flexione os joelhos trazendo a parte inferior das pernas para baixo e para trás.','Retorne lentamente sem soltar a carga de repente.'],'Mantenha as costas apoiadas e o quadril estável.');
add('b6','Cadeira abdutora','Máquina',2,'15–20','60–90 s','Glúteos laterais','b6','Máquina sentada em que você afasta as pernas contra a resistência.',[
'Sente-se com coluna e quadril apoiados, com as almofadas na face externa das coxas.','Abra as pernas de modo controlado.','Volte devagar, sem deixar as placas baterem.'],'Não impulsione o tronco nem force uma abertura dolorosa.');
add('b7','Rosca direta','Livre',2,'10–12','60–90 s','Bíceps','b7','Flexão dos cotovelos segurando uma barra, com o tronco estável.',[
'Fique em pé segurando a barra à frente das coxas.','Flexione os cotovelos e aproxime a barra dos ombros.','Desça controladamente, sem deslocar os cotovelos para trás.'],'Evite balançar o tronco para erguer mais peso.');
add('b8','Tríceps na corda','Cabo',2,'10–15','60–90 s','Tríceps','b8','Extensão dos cotovelos com corda acoplada à polia alta.',[
'Em pé, segure a corda e mantenha os cotovelos perto do tronco.','Estenda os braços para baixo, afastando levemente as pontas da corda.','Volte devagar com os ombros estáveis.'],'Não transforme o movimento em uma puxada com costas e ombros.');
// QUARTA: 7 exercícios
add('c1','Stiff com barra','Livre',3,'6–10','2–3 min','Posteriores e glúteos','c1','Dobradiça de quadril com barra, priorizando a cadeia posterior.',[
'Segure a barra à frente das coxas, com joelhos levemente flexionados.','Leve o quadril para trás, aproximando a barra das pernas enquanto inclina o tronco com a coluna neutra.','Retorne estendendo o quadril e contraindo os glúteos.'],'Não force a barra até o chão se a mobilidade não permitir manter a coluna estável.');
add('c2','Agachamento búlgaro','Livre',3,'8–10 por perna','90–120 s','Quadríceps e glúteos','c2','Agachamento unilateral com o pé de trás apoiado em um banco.',[
'Coloque o peito do pé de trás no banco e apoie o outro pé à frente.','Flexione a perna da frente, descendo o quadril com equilíbrio.','Empurre o chão para subir, mantendo o joelho alinhado ao pé.'],'Comece sem carga ou com halteres leves até dominar o equilíbrio.');
add('c3','Mesa flexora deitada','Máquina',3,'10–15','60–90 s','Posteriores de coxa','c3','Flexão dos joelhos deitado de barriga para baixo na máquina.',[

function beginGoogleSignIn(){
 const button=document.querySelector('[data-action="auth-google"]');
 if(button){button.disabled=true;button.setAttribute('aria-busy','true');}
 const feedback=document.querySelector('#auth-feedback');
 if(feedback)feedback.textContent='Redirecionando para a conta Google…';

 url.searchParams.set('provider','google');

 window.location.assign(url.toString());
}
async function finishGoogleOAuthRedirect(){
 const params=new URLSearchParams(window.location.hash.replace(/^#/,''));
 const query=new URLSearchParams(window.location.search);
 const accessToken=params.get('access_token');
 const refreshToken=params.get('refresh_token');
 const oauthError=params.get('error_description')||params.get('error')||query.get('error_description')||query.get('error');
 if(!accessToken&&!oauthError)return null;
 // OAuth tokens are sensitive: immediately clear the URL fragment and errors.
 window.history.replaceState(null,'',window.location.pathname);
 if(oauthError){
  if(/access_denied|cancel|cancelado/i.test(oauthError))return {error:'A entrada com Google foi cancelada. Você pode tentar novamente ou entrar por e-mail.'};
  return {error:'Não foi possível entrar com Google: '+String(oauthError).slice(0,180)+'. Confira se o provedor Google está configurado no Supabase.'};
 }
 if(!refreshToken)return {error:'O Google não retornou uma sessão completa. Tente entrar novamente.'};
 try{
  const user=await cloudRequest('/auth/v1/user',{
   auth:false,headers:{Authorization:'Bearer '+accessToken}
  });
  if(!user||!user.id)throw Error('Usuário não identificado.');
  const expiresIn=Number(params.get('expires_in'))||3600;
  const session={access_token:accessToken,refresh_token:refreshToken,
    token_type:'bearer',expires_in:expiresIn,expires_at:Math.floor(Date.now()/1000)+expiresIn,user};
  setCloudSession(session);
  CLOUD.guest=false;localStorage.removeItem('fullbody-2-guest');
  CLOUD.message='';CLOUD.error='';
  return {ok:true};
 }catch(e){
  return {error:'Não foi possível concluir a entrada com Google. Verifique a conexão e tente novamente.'};
 }
}
async function bootCloud(){
 try{CLOUD.session=JSON.parse(localStorage.getItem(CLOUD_SESSION_STORE)||'null');CLOUD.user=CLOUD.session?.user||null;}catch(e){}
 CLOUD.guest=!CLOUD.session && localStorage.getItem('fullbody-2-guest')==='1';
 CLOUD.ready=true;
 const googleResult=await finishGoogleOAuthRedirect();
 if(googleResult?.error){CLOUD.message=googleResult.error;CLOUD.mode='login';CLOUD.guest=false;localStorage.removeItem('fullbody-2-guest');}
 if(googleResult?.ok){
  CLOUD.message='Carregando seus dados da nuvem…';renderAuth();
  try{await loadCloudUser();CLOUD.message='';activeTab='home';render();return;}
  catch(e){CLOUD.message='O Google autenticou sua conta, mas os dados não foram carregados. Confira a conexão e tente novamente.';setCloudSession(null);render();return;}
 }
 if(CLOUD.session){
  renderAuth();CLOUD.message='Carregando seus dados da nuvem…';
  (async()=>{try{
   if(!await ensureCloudSession()){setCloudSession(null);CLOUD.message='Faça login novamente.';render();return;}
   await loadCloudUser();render();
  }catch(e){CLOUD.message='Não foi possível carregar sua conta. Confira a internet e entre novamente.';setCloudSession(null);render();}})();
 }else render();
}
